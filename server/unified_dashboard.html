<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>NH Stock Trader v0.8.1</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff}.wrap{max-width:900px;margin:auto;padding:14px}.top,.row,.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-size:21px;font-weight:900}.muted{color:#94a3b8;font-size:13px}.card,.metric{background:#151c31;border:1px solid #26314f;border-radius:14px;padding:13px}.grid{display:grid;gap:10px}.metrics{grid-template-columns:repeat(3,1fr);margin:12px 0}.metric strong{display:block;font-size:20px;margin-top:4px}.row{padding:10px 0;border-bottom:1px solid #26314f}.row:last-child{border:0}.section{margin-top:12px}.badge,.tag{border:1px solid #26314f;background:#1e293b;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}.ok,.positive{color:#4ade80}.bad,.negative{color:#fb7185}.blue{color:#60a5fa}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#0f766e;color:white}.btn:disabled{opacity:.45}.scanner{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{border:1px solid #26314f;border-radius:11px;padding:10px}.score{font-size:20px;font-weight:900}.buy{color:#86efac}.setup{color:#fde68a}.empty{color:#94a3b8;padding:6px 0}@media(max-width:600px){.metrics{grid-template-columns:repeat(2,1fr)}.scanner{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:19px}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">NH Stock Trader <span class="blue">v0.8.1</span></div><div class="muted" id="clock">연결 중...</div></div><div><span class="badge bad">REAL ORDER OFF</span> <span class="badge" id="server">SERVER...</span></div></div><div class="card section"><div class="head"><div><b>시스템 업데이트</b><div class="muted">휴대폰 → Tailscale → Lenovo → GitHub → 자동 재시작</div></div><button class="btn" id="updateBtn">프로그램 업데이트</button></div><div class="muted" id="updateStatus" style="margin-top:8px">열린 Paper 포지션이 있으면 업데이트가 차단됩니다.</div></div><div class="grid metrics"><div class="metric"><span class="muted">오늘 손익</span><strong id="pnl">0원</strong></div><div class="metric"><span class="muted">평가손익</span><strong id="upnl">0원</strong></div><div class="metric"><span class="muted">연속 손실</span><strong id="loss">0 / 2</strong></div><div class="metric"><span class="muted">Paper Loop</span><strong id="loop">-</strong></div><div class="metric"><span class="muted">Daily Lock</span><strong id="lock">-</strong></div><div class="metric"><span class="muted">Protected</span><strong>068270</strong></div></div><div class="card"><div class="head"><b>실시간 Scanner</b><button class="btn" id="refresh">새로고침</button></div><div class="scanner" id="scanner"></div></div><div class="grid section" style="grid-template-columns:1fr 1fr"><div class="card"><b>현재 Paper 포지션</b><div id="positions"></div></div><div class="card"><b>최근 Paper 거래</b><div id="trades"></div></div></div><div class="muted section">Lenovo background engine · Tailscale remote · 5초 자동 갱신</div></div><script>const $=s=>document.querySelector(s),won=n=>Math.round(Number(n||0)).toLocaleString('ko-KR')+'원',cl=n=>Number(n||0)>=0?'positive':'negative';let busy=false;async function load(){try{let r=await fetch('/api/mobile/status',{cache:'no-store'}),d=await r.json();$('#clock').textContent='Engine v'+d.version+' · '+new Date(d.serverTime).toLocaleString('ko-KR');$('#server').textContent=d.collector.running?'ONLINE':'OFFLINE';$('#server').className='badge '+(d.collector.running?'ok':'bad');$('#pnl').textContent=won(d.daily.pnl);$('#pnl').className=cl(d.daily.pnl);let u=d.positions.reduce((s,x)=>s+Number(x.unrealized_pnl||0),0);$('#upnl').textContent=won(u);$('#upnl').className=cl(u);$('#loss').textContent=d.daily.consecutiveLosses+' / 2';$('#loop').textContent=d.paperLoop.running?'RUNNING':'STOP';$('#loop').className=d.paperLoop.running?'ok':'bad';$('#lock').textContent=d.daily.locked?'ON':'OFF';$('#lock').className=d.daily.locked?'bad':'ok';let ss=[...d.scanner].sort((a,b)=>b.score-a.score);$('#scanner').innerHTML=ss.map(x=>`<div class="item"><div class="row"><div><b>${x.code}</b><div class="muted">${x.indicators?.price?won(x.indicators.price):'-'}</div></div><div style="text-align:right"><div class="score">${Number(x.score||0).toFixed(1)}</div><span class="tag ${x.action==='BUY_CANDIDATE'?'buy':x.action==='SETUP'?'setup':''}">${x.action}</span></div></div><div class="muted">${(x.reasons||[]).slice(0,5).join(' · ')||'조건 대기'}</div></div>`).join('')||'<div class="empty">데이터 없음</div>';$('#positions').innerHTML=d.positions.length?d.positions.map(x=>`<div class="row"><div><b>${x.code}</b><div class="muted">${x.qty}주</div></div><b class="${cl(x.unrealized_pnl)}">${won(x.unrealized_pnl)}</b></div>`).join(''):'<div class="empty">열린 포지션 없음</div>';$('#trades').innerHTML=d.recentTrades?.length?d.recentTrades.slice(0,6).map(x=>`<div class="row"><div><b>${x.code}</b><div class="muted">${x.exit_reason||x.status}</div></div><b class="${cl(x.pnl)}">${won(x.pnl)}</b></div>`).join(''):'<div class="empty">거래 없음</div>';$('#updateBtn').disabled=busy||d.positions.length>0;if(d.positions.length&&!busy)$('#updateStatus').textContent='열린 Paper 포지션이 있어 업데이트가 잠겨 있습니다.';}catch(e){$('#server').textContent='RECONNECTING'}}async function update(){if(busy||!confirm('GitHub 최신 버전으로 업데이트하고 Lenovo 서버를 재시작할까요?'))return;busy=true;$('#updateBtn').disabled=true;$('#updateStatus').textContent='업데이트 요청 중...';try{let r=await fetch('/api/system/update/run',{method:'POST'}),j=await r.json();if(!r.ok){busy=false;$('#updateStatus').textContent='차단: '+(j.detail||'오류');load();return}$('#updateStatus').textContent='업데이트 중 · 자동 재연결 대기...';}catch(e){$('#updateStatus').textContent='서버 재시작 중...'}let n=0,t=setInterval(async()=>{n++;try{let r=await fetch('/api/system/update/status?x='+Date.now(),{cache:'no-store'});if(r.ok&&n>2){let j=await r.json();clearInterval(t);$('#updateStatus').textContent='업데이트 완료 · UI v'+j.uiVersion;setTimeout(()=>location.reload(),800)}}catch(e){}if(n>60){clearInterval(t);busy=false;$('#updateStatus').textContent='재연결 시간 초과 · 잠시 후 새로고침하세요.'}},2000)}$('#updateBtn').onclick=update;$('#refresh').onclick=load;load();setInterval(()=>{if(!busy)load()},5000);</script></body></html>
