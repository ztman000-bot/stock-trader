name: Marcap Regime Reference

on:
  workflow_dispatch:
  schedule:
    # Sunday 18:30 UTC = Monday 03:30 KST. Historical reference only; no need for intraday cadence.
    - cron: '30 18 * * 0'
  push:
    branches: [main]
    paths:
      - 'server/marcap_regime_builder.py'
      - 'server/regime_aggregate_schema.py'
      - '.github/scripts/propose_regime_reference.py'
      - '.github/workflows/marcap-regime-reference.yml'

permissions:
  contents: read

concurrency:
  group: marcap-regime-reference
  cancel-in-progress: false

jobs:
  build-regime-reference:
    if: github.repository == 'ztman000-bot/stock-trader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build-only parquet dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Resolve upstream FinanceData/marcap commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/FinanceData/marcap.git refs/heads/master | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build compact aggregate reference
        run: |
          python server/marcap_regime_builder.py build \
            --output research/regime/marcap_regime_daily.csv \
            --meta research/regime/marcap_regime_meta.json \
            --upstream-ref '${{ steps.upstream.outputs.sha }}' \
            --mode auto
          python server/marcap_regime_builder.py validate \
            --output research/regime/marcap_regime_daily.csv

      - name: Verify generated output is aggregate only
        shell: bash
        run: |
          set -euo pipefail
          test -f research/regime/marcap_regime_daily.csv
          test -f research/regime/marcap_regime_meta.json
          ! find research/regime -type f \( -name '*.parquet' -o -name '*.gz' -o -name '*.zip' \) | grep -q .
          ! head -1 research/regime/marcap_regime_daily.csv | grep -q ',Code,'

      - name: Run safety checks before proposing changes
        run: |
          python -m compileall -q .github/scripts server tests
          python -m unittest discover -s tests -p 'test_*.py' -v

      # This only proposes a change. It never approves workflows or merges a PR.
      # GITHUB_TOKEN-created PRs may require a maintainer to approve workflow runs.
      - name: Propose aggregate-only pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/propose_regime_reference.py
