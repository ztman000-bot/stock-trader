name: Safety Invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  locked-safety-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile server sources
        run: python -m compileall -q server tests
      - name: Validate Android shell scripts
        run: |
          bash -n server/start_android.sh
          bash -n server/android_watchdog_v2.sh
          bash -n server/android_update.sh
          bash -n server/recover_android_server.sh
          bash -n server/ensure_remote_health.sh
          bash -n server/remote_health_guardian.sh
          bash -n server/ensure_offsite_backup.sh
      - name: Run safety and validation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
