name: Safety Invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  locked-safety-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile server sources
        run: python -m compileall -q server tests
      - name: Run safety invariant tests
        run: python -m unittest discover -s tests -p 'test_safety_invariants.py' -v
