name: Android Client APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client-build.yml'
      - 'tests/test_android_native_client.py'
  push:
    branches: [ main ]
    paths:
      - 'android-client/**'
      - '.github/workflows/android-client-build.yml'
      - 'tests/test_android_native_client.py'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: android-client
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-day-trader-android-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
